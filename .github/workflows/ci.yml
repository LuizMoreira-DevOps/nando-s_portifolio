name: CI | Continuous Integration

on:
    push:
        branches:
            - main

    pull_request:

    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ==========================================
    # REPOSITORY VALIDATION
    # ==========================================

    repository:
        name: Repository Validation
        runs-on: ubuntu-latest
        timeout-minutes: 15

        outputs:
            application_present: ${{ steps.scope.outputs.application_present }}

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Validate version
              run: |
                  node <<'NODE'
                  const pkg = require("./package.json");
                  const lock = require("./package-lock.json");

                  if (
                      pkg.version !== lock.version ||
                      pkg.version !== lock.packages[""].version
                  ) {
                      throw new Error("Package versions do not match.");
                  }

                  console.log(`Project version: ${pkg.version}`);
                  NODE

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Security audit
              run: npm audit --omit=dev --audit-level=high

            - name: Detect application
              id: scope
              run: |
                  if [[ -n "$(git ls-files -- app/)" ]]; then
                      echo "application_present=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "application_present=false" >> "$GITHUB_OUTPUT"
                      echo "Infrastructure phase: application not validated." >> "$GITHUB_STEP_SUMMARY"
                  fi

    # ==========================================
    # APPLICATION VALIDATION
    # ==========================================

    quality:
        name: Application Quality
        needs: repository
        if: needs.repository.outputs.application_present == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Validate generated themes
              run: |
                  git ls-files --error-unmatch styles/approved-themes.css
                  npm run sync:themes
                  git diff --exit-code -- styles/approved-themes.css

            - name: ESLint
              run: npm run lint

            - name: TypeScript
              run: npm run typecheck

            - name: Build
              run: npm run build
